
workflows:
  android-build:
    name: Doraflix APK Build
    max_build_duration: 60
    instance_type: linux

    environment:
      java: 17

    scripts:
      - name: Prepare Gradle
        script: |
          set -e
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Accept Android Licenses
        script: |
          set -e
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        script: |
          set -e
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Doraflix APK
        script: |
          set -e
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      
