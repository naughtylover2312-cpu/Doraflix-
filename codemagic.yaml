workflows:
  android-build:
    name: Doraflix APK Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Build Android APK
        script: |
          gradle assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk
